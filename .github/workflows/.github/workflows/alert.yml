name: 劇烈波動警示

on:
  schedule:
    - cron: "13,43 * * * *"   # 每 30 分鐘（避開整點）；GitHub 可能延遲 5～30 分鐘
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit          # 和「更新黃金觀測站資料」共用，避免同時 push 打架
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 檢查是否劇烈波動
        run: python scripts/check_alert.py
      - name: 狀態有變才提交
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data/alert.json
          if git diff --cached --quiet; then echo "沒有變化，不提交"; exit 0; fi
          git commit -m "alert: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
