name: 更新黃金觀測站資料

on:
  schedule:
    # 台灣時間 = UTC + 8
    - cron: "0 0 * * *"     # 台灣 08:00
    - cron: "0 4 * * *"     # 台灣 12:00
    - cron: "0 7 * * *"     # 台灣 15:00
    - cron: "15 13 * * *"   # 台灣 21:15（夏令時間美國數據 20:30 公布後；11 月冬令改為 21:30 公布，可改成 "15 14 * * *"＝22:15）
    - cron: "0 15 * * *"    # 台灣 23:00（美股開盤後）
  workflow_dispatch:      # 也可以在 GitHub 網頁上按「Run workflow」手動更新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # 卡住最多 8 分鐘就中止並顯示紅叉，不會無限等
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓資料並判讀
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 強烈建議設定（免費）；沒有時改走 fredgraph.csv，機房 IP 可能被擋
          PYTHONUNBUFFERED: "1"
        run: python scripts/fetch_data.py

      - name: 提交 data.json
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
